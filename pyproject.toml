[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-memory-new"
version = "0.1.0"
description = "GRPO-trained memory VLM for hierarchical VLA long-horizon manipulation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    # Upper bound is set by ms-swift 3.x, which requires transformers<4.58.
    # Qwen3VLForConditionalGeneration is available across the entire allowed
    # range (added in the 4.5x series); a `>=5.0` pin would resolve-fail
    # against ms-swift 3.x.
    "transformers>=4.49",
    "peft>=0.13",
    "accelerate>=1.2",
    "qwen-vl-utils>=0.0.8",
    "jsonschema>=4.0",
    "numpy>=1.24",
    "Pillow>=10.0",
    "pyyaml>=6.0",
    "modal>=0.73",
    # Required locally by modal.Secret.from_dotenv() in modal_server.py;
    # parsed on the user's machine at `modal run` time, not in the container.
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]
# Heavy training stack — only installed inside the Modal container, never on
# the dev machine. ms-swift + flash-attn require CUDA at build time.
train = [
    # ms-swift 4.x dropped/renamed several CLI flags upstream's recipe uses
    # (e.g. --train_type lora). Stay on 3.x; see modal_train.py pip_install.
    "ms-swift>=3.0,<4.0",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "wandb>=0.19",
    # deepspeed intentionally NOT listed — see modal_train.py pip_install
    # comment. LoRA on 4× A100-80GB doesn't need ZeRO; deepspeed 0.19's
    # import-time nvcc check fails on cudnn-runtime base images.
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
